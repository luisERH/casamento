<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Filtro de sombra suave para as folhas -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#091402" flood-opacity="0.35" />
    </filter>

    <!-- Gradientes para variação de cor e realismo das folhas -->
    <radialGradient id="leafGradStandard" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#99cc4b" />
      <stop offset="60%" stop-color="#4e802b" />
      <stop offset="100%" stop-color="#244510" />
    </radialGradient>

    <radialGradient id="leafGradDark" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#699e33" />
      <stop offset="70%" stop-color="#345e1d" />
      <stop offset="100%" stop-color="#162e0a" />
    </radialGradient>

    <radialGradient id="leafGradLight" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#c3f071" />
      <stop offset="60%" stop-color="#6ba63c" />
      <stop offset="100%" stop-color="#305e14" />
    </radialGradient>

    <!-- Modelo de Folha 1 - Padrão -->
    <g id="ivy-leaf-standard">
      <path d="M 0 0 C -8 -5, -15 -2, -18 -10 C -20 -18, -12 -22, -10 -25 C -20 -30, -18 -45, -8 -45 C -4 -45, -2 -48, 0 -55 C 2 -48, 4 -45, 8 -45 C 18 -45, 20 -30, 10 -25 C 12 -22, 20 -18, 18 -10 C 15 -2, 8 -5, 0 0 Z" fill="url(#leafGradStandard)" />
      <!-- Nervuras da folha -->
      <path d="M 0 0 L 0 -50 M 0 0 L -12 -33 M 0 0 L 12 -33" stroke="#e3ffad" stroke-width="1.2" opacity="0.7" fill="none" stroke-linecap="round" />
    </g>

    <!-- Modelo de Folha 2 - Escura -->
    <g id="ivy-leaf-dark">
      <path d="M 0 0 C -10 -4, -18 -1, -20 -10 C -22 -19, -14 -22, -12 -26 C -24 -30, -22 -48, -10 -47 C -5 -47, -3 -51, 0 -58 C 3 -51, 5 -47, 10 -47 C 22 -48, 24 -30, 12 -26 C 14 -22, 22 -19, 20 -10 C 18 -1, 10 -4, 0 0 Z" fill="url(#leafGradDark)" />
      <!-- Nervuras da folha -->
      <path d="M 0 0 L 0 -53 M 0 0 L -14 -35 M 0 0 L 14 -35" stroke="#bfe685" stroke-width="1.2" opacity="0.6" fill="none" stroke-linecap="round" />
    </g>

    <!-- Modelo de Folha 3 - Clara / Jovem -->
    <g id="ivy-leaf-light">
      <path d="M 0 0 C -6 -6, -12 -3, -15 -11 C -17 -18, -10 -21, -8 -24 C -16 -28, -14 -42, -6 -42 C -3 -42, -2 -45, 0 -52 C 2 -45, 3 -42, 6 -42 C 14 -42, 16 -28, 8 -24 C 10 -21, 17 -18, 15 -11 C 12 -3, 6 -6, 0 0 Z" fill="url(#leafGradLight)" />
      <!-- Nervuras da folha -->
      <path d="M 0 0 L 0 -47 M 0 0 L -10 -30 M 0 0 L 10 -30" stroke="#f0ffd4" stroke-width="1" opacity="0.8" fill="none" stroke-linecap="round" />
    </g>

    <!-- Definição do Padrão Seamless (Tile de 400x400px) -->
    <pattern id="trellisPattern" width="400" height="400" patternUnits="userSpaceOnUse">
      <!-- Fundo transparente: o escuro translúcido vem do CSS (cobre na hora, sem flash) -->
      <rect width="400" height="400" fill="none" />

      <!-- 1. CAMADA DE TRELIÇA DESCENTE (\) -->
      <!-- Sombras das ripas descendentes -->
      <g stroke="#1b1008" stroke-width="22" opacity="0.3" stroke-linecap="round">
        <path d="M -2 2 L 398 402" />
        <path d="M 198 2 L 398 202" />
        <path d="M -2 202 L 198 402" />
      </g>
      <!-- Ripas de Madeira Base -->
      <g stroke="#54331e" stroke-width="16" stroke-linecap="round">
        <path d="M 0 0 L 400 400" />
        <path d="M 200 0 L 400 200" />
        <path d="M 0 200 L 200 400" />
      </g>
      <!-- Ripas de Madeira Textura / Tom Médio -->
      <g stroke="#73472b" stroke-width="12" stroke-linecap="round">
        <path d="M 0 0 L 400 400" />
        <path d="M 200 0 L 400 200" />
        <path d="M 0 200 L 200 400" />
      </g>
      <!-- Ripas de Madeira Brilho / Relevo -->
      <g stroke="#915f41" stroke-width="3" opacity="0.75" stroke-linecap="round">
        <path d="M -1 -1 L 399 399" />
        <path d="M 199 -1 L 399 199" />
        <path d="M -1 199 L 199 399" />
      </g>

      <!-- 2. CAMADA DE TRELIÇA ASCENDENTE (/) - Fica por cima para sobreposição real -->
      <!-- Sombras das ripas ascendentes -->
      <g stroke="#1b1008" stroke-width="22" opacity="0.3" stroke-linecap="round">
        <path d="M -2 398 L 398 -2" />
        <path d="M -2 198 L 198 -2" />
        <path d="M 198 398 L 398 198" />
      </g>
      <!-- Ripas de Madeira Base -->
      <g stroke="#4f301c" stroke-width="16" stroke-linecap="round">
        <path d="M 0 400 L 400 0" />
        <path d="M 0 200 L 200 0" />
        <path d="M 200 400 L 400 200" />
      </g>
      <!-- Ripas de Madeira Textura / Tom Médio -->
      <g stroke="#6e4329" stroke-width="12" stroke-linecap="round">
        <path d="M 0 400 L 400 0" />
        <path d="M 0 200 L 200 0" />
        <path d="M 200 400 L 400 200" />
      </g>
      <!-- Ripas de Madeira Brilho / Relevo -->
      <g stroke="#8f5c3e" stroke-width="3" opacity="0.75" stroke-linecap="round">
        <path d="M -1 401 L 399 1" />
        <path d="M -1 201 L 199 1" />
        <path d="M 199 401 L 399 201" />
      </g>

      <!-- 4. FOLHAS COM FILTRO DE SOMBRA ATIVO -->
      <g filter="url(#leafShadow)">
        <!-- Folhas Centrais (Sem necessidade de wrap) -->
        <use href="#ivy-leaf-standard" transform="translate(100, 100) rotate(-30) scale(1.1)" />
        <use href="#ivy-leaf-light" transform="translate(125, 115) rotate(45) scale(0.95)" />
        
        <use href="#ivy-leaf-dark" transform="translate(280, 110) rotate(120) scale(1.05)" />
        <use href="#ivy-leaf-standard" transform="translate(320, 80) rotate(-60) scale(0.9)" />
        
        <use href="#ivy-leaf-light" transform="translate(110, 280) rotate(85) scale(1)" />
        <use href="#ivy-leaf-dark" transform="translate(75, 320) rotate(-140) scale(1.15)" />
        
        <use href="#ivy-leaf-standard" transform="translate(310, 320) rotate(15) scale(1)" />
        <use href="#ivy-leaf-light" transform="translate(285, 275) rotate(-110) scale(1.05)" />
        
        <use href="#ivy-leaf-standard" transform="translate(190, 180) rotate(25) scale(1.05)" />
        <use href="#ivy-leaf-dark" transform="translate(215, 220) rotate(-100) scale(0.9)" />
        
        <use href="#ivy-leaf-light" transform="translate(150, 50) rotate(70) scale(0.95)" />
        <use href="#ivy-leaf-standard" transform="translate(250, 350) rotate(-150) scale(1.1)" />
        <use href="#ivy-leaf-dark" transform="translate(250, 145) rotate(160) scale(1)" />
        <use href="#ivy-leaf-light" transform="translate(145, 245) rotate(-90) scale(0.95)" />

        <!-- Folhas das Bordas (Com compensação para encaixe perfeito) -->
        
        <!-- Borda Horizontal (Esquerda / Direita) -->
        <!-- Folha em x=15 e sua cópia em x=415 -->
        <use href="#ivy-leaf-standard" transform="translate(15, 150) rotate(135) scale(1.05)" />
        <use href="#ivy-leaf-standard" transform="translate(415, 150) rotate(135) scale(1.05)" />
        
        <!-- Folha em x=385 e sua cópia em x=-15 -->
        <use href="#ivy-leaf-dark" transform="translate(385, 250) rotate(-80) scale(1)" />
        <use href="#ivy-leaf-dark" transform="translate(-15, 250) rotate(-80) scale(1)" />

        <!-- Borda Vertical (Topo / Base) -->
        <!-- Folha em y=15 e sua cópia em y=415 -->
        <use href="#ivy-leaf-light" transform="translate(200, 15) rotate(15) scale(1)" />
        <use href="#ivy-leaf-light" transform="translate(200, 415) rotate(15) scale(1)" />
        
        <!-- Folha em y=385 e sua cópia em y=-15 -->
        <use href="#ivy-leaf-standard" transform="translate(220, 385) rotate(-45) scale(0.95)" />
        <use href="#ivy-leaf-standard" transform="translate(220, -15) rotate(-45) scale(0.95)" />

        <!-- Cantos (Requer 4 pontos de renderização simultâneos) -->
        <!-- Canto Superior Esquerdo (10, 10) -->
        <use href="#ivy-leaf-dark" transform="translate(10, 10) rotate(-120) scale(1.05)" />
        <use href="#ivy-leaf-dark" transform="translate(410, 10) rotate(-120) scale(1.05)" />
        <use href="#ivy-leaf-dark" transform="translate(10, 410) rotate(-120) scale(1.05)" />
        <use href="#ivy-leaf-dark" transform="translate(410, 410) rotate(-120) scale(1.05)" />

        <!-- Canto Inferior Direito (390, 390) -->
        <use href="#ivy-leaf-light" transform="translate(390, 390) rotate(60) scale(0.95)" />
        <use href="#ivy-leaf-light" transform="translate(-10, 390) rotate(60) scale(0.95)" />
        <use href="#ivy-leaf-light" transform="translate(390, -10) rotate(60) scale(0.95)" />
        <use href="#ivy-leaf-light" transform="translate(-10, -10) rotate(60) scale(0.95)" />
      </g>
    </pattern>
  </defs>

  <!-- Retângulo principal preenchido com a treliça infinita -->
  <rect width="100%" height="100%" fill="url(#trellisPattern)" />
</svg>